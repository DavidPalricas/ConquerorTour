# Runs the rule tests, exports the game for the Web and publishes it on GitHub Pages.
# In the repository settings, set Pages > Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Keep in line with the Godot version used to develop the project.
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install Godot and the export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          name="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fsSL -o godot.zip "${base}/${name}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/${name}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "${name}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      - name: Import assets
        run: godot --headless --path game --import

      - name: Rule tests
        run: godot --headless --path game res://tests/test_runner.tscn

      - name: Full match smoke test
        run: godot --headless --path game res://tests/smoke_match.tscn

      - name: Export for the Web
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release "Web" ../build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
